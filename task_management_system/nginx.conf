server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html chat.html;

    # Serve the AI chat UI at /chat
    location /chat {
        try_files /chat.html =404;
    }

    # Proxy all /api/* requests to the backend service
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Simple health check for the frontend container itself
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Serve static assets; fall back to index
    location / {
        try_files $uri $uri/ /chat.html;
    }
}

