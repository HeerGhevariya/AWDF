<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Widget — Task Manager</title>
  <style>
    /* ── Reset ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:     #6c63ff;
      --accent-dim: #3d3880;
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --surface2:   #12141e;
      --border:     #2a2d3e;
      --text:       #e2e4f0;
      --muted:      #6b7280;
      --user-bg:    #6c63ff;
      --ai-bg:      #1e2130;
      --danger:     #ef4444;
      --success:    #22c55e;
    }

    /* ── Demo page background (remove in a real app) ───────────────── */
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .demo-hint {
      text-align: center;
      color: var(--muted);
      font-size: .95rem;
      user-select: none;
      pointer-events: none;
    }
    .demo-hint span { font-size: 2rem; display: block; margin-bottom: .5rem; }

    /* ═══════════════════════════════════════════════════════════════
       FLOATING CHAT WIDGET
    ═══════════════════════════════════════════════════════════════ */

    /* ── Bubble trigger button ─────────────────────────────────────── */
    #chat-bubble {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 9998;

      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      cursor: pointer;

      background: linear-gradient(135deg, var(--accent) 0%, #a78bfa 100%);
      box-shadow: 0 6px 24px rgba(108,99,255,.55);

      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;

      transition: transform .25s cubic-bezier(.34,1.56,.64,1),
                  box-shadow .25s ease,
                  opacity .2s ease;
    }
    #chat-bubble:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 30px rgba(108,99,255,.7);
    }
    #chat-bubble.open { transform: scale(1) rotate(20deg); }

    /* Unread badge */
    #chat-bubble .badge {
      position: absolute;
      top: -2px; right: -2px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--danger);
      font-size: .7rem;
      font-weight: 700;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg);
    }
    #chat-bubble .badge.show { display: flex; }

    /* ── Chat panel ────────────────────────────────────────────────── */
    #chat-panel {
      position: fixed;
      bottom: 102px;
      right: 28px;
      z-index: 9999;

      width: min(420px, calc(100vw - 32px));
      height: min(560px, calc(100dvh - 130px));

      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);

      /* Hidden by default */
      opacity: 0;
      transform: translateY(20px) scale(.97);
      pointer-events: none;
      transition: opacity .25s ease, transform .25s cubic-bezier(.34,1.3,.64,1);
    }
    #chat-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    /* ── Panel header ──────────────────────────────────────────────── */
    .panel-header {
      background: linear-gradient(135deg, #1e1b4b 0%, #1a1d27 100%);
      border-bottom: 1px solid var(--border);
      padding: .9rem 1rem;
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-shrink: 0;
    }
    .panel-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: grid; place-items: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .panel-info { flex: 1; min-width: 0; }
    .panel-name  { font-weight: 700; font-size: .92rem; }
    .panel-sub   { font-size: .72rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
    .dot-online  { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0; }

    .panel-actions { display: flex; gap: .4rem; }
    .icon-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
      display: grid; place-items: center;
      transition: background .15s, color .15s;
    }
    .icon-btn:hover { background: var(--border); color: var(--text); }

    /* ── Login form (shown when not authenticated) ─────────────────── */
    #panel-login {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      gap: .9rem;
    }
    #panel-login .login-icon { font-size: 2.5rem; }
    #panel-login h3 { font-size: 1rem; }
    #panel-login p  { font-size: .8rem; color: var(--muted); text-align: center; }

    .field { width: 100%; }
    .field label { font-size: .75rem; color: var(--muted); display: block; margin-bottom: .3rem; }
    .field input {
      width: 100%;
      padding: .6rem .85rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: .9rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }
    .field input:focus { border-color: var(--accent); }

    .btn-sign-in {
      width: 100%;
      padding: .65rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn-sign-in:hover:not(:disabled) { opacity: .85; }
    .btn-sign-in:disabled { opacity: .5; cursor: not-allowed; }

    .login-err {
      width: 100%;
      background: #2d1a1a;
      border: 1px solid var(--danger);
      border-radius: 6px;
      padding: .5rem .75rem;
      font-size: .8rem;
      color: #fca5a5;
      display: none;
    }
    .login-err.show { display: block; }

    /* ── Messages area ─────────────────────────────────────────────── */
    #panel-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem .9rem;
      display: flex;
      flex-direction: column;
      gap: .7rem;
      scroll-behavior: smooth;
    }
    #panel-messages::-webkit-scrollbar { width: 4px; }
    #panel-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Suggestions (welcome state) */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-top: .5rem;
    }
    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .35rem .75rem;
      border-radius: 16px;
      font-size: .75rem;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      font-family: inherit;
    }
    .chip:hover { border-color: var(--accent); background: var(--accent-dim); }

    /* Message bubbles */
    .msg {
      display: flex;
      gap: .5rem;
      max-width: 90%;
      animation: popIn .18s ease;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.ai   { align-self: flex-start; }

    .msg-av {
      width: 26px; height: 26px;
      border-radius: 50%;
      font-size: .8rem;
      display: grid; place-items: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg.user .msg-av { background: var(--accent-dim); }
    .msg.ai   .msg-av { background: #252840; }

    .bbl {
      padding: .55rem .85rem;
      border-radius: 14px;
      font-size: .86rem;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.user .bbl {
      background: var(--user-bg);
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .msg.ai .bbl {
      background: var(--ai-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 3px;
    }

    /* Typing dots */
    .typing-dots span {
      display: inline-block;
      width: 5px; height: 5px;
      background: var(--muted);
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce .9s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .15s; }
    .typing-dots span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%         { transform: translateY(-5px); }
    }

    /* Welcome banner inside panel */
    .panel-welcome {
      text-align: center;
      padding: .75rem .5rem 1rem;
      color: var(--muted);
      font-size: .8rem;
    }
    .panel-welcome h4 { color: var(--text); margin-bottom: .3rem; font-size: .92rem; }

    /* ── Input area ────────────────────────────────────────────────── */
    #panel-input-area {
      padding: .75rem .9rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: .5rem;
      align-items: flex-end;
    }
    #panel-input {
      flex: 1;
      resize: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: .88rem;
      padding: .6rem .8rem;
      font-family: inherit;
      line-height: 1.4;
      max-height: 100px;
      overflow-y: auto;
      outline: none;
      transition: border-color .2s;
    }
    #panel-input:focus { border-color: var(--accent); }
    #panel-input::placeholder { color: var(--muted); }

    #panel-send {
      width: 38px; height: 38px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      flex-shrink: 0;
      display: grid; place-items: center;
      transition: opacity .2s, transform .1s;
    }
    #panel-send:hover:not(:disabled) { opacity: .85; }
    #panel-send:active { transform: scale(.93); }
    #panel-send:disabled { opacity: .45; cursor: not-allowed; }

    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: .4rem;
    }
    .bottom-row span { font-size: .68rem; color: var(--muted); }
    .clear-link {
      font-size: .7rem;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
    }
    .clear-link:hover { color: var(--text); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Demo background hint -->
  <div class="demo-hint">
    <span>👇</span>
    Click the button in the bottom-right to chat
  </div>

  <!-- ═══════════════════════════════════════════════════════
       FLOATING BUBBLE
  ════════════════════════════════════════════════════════ -->
  <button id="chat-bubble" onclick="togglePanel()" title="Chat with AI">
    <span id="bubble-icon">🤖</span>
    <span class="badge" id="unread-badge">1</span>
  </button>

  <!-- ═══════════════════════════════════════════════════════
       CHAT PANEL
  ════════════════════════════════════════════════════════ -->
  <div id="chat-panel">

    <!-- Header -->
    <div class="panel-header">
      <div class="panel-avatar">🤖</div>
      <div class="panel-info">
        <div class="panel-name">AI Task Assistant</div>
        <div class="panel-sub">
          <span class="dot-online"></span>
          Powered by Groq · Llama 3
        </div>
      </div>
      <div class="panel-actions">
        <button class="icon-btn" onclick="clearChat()" title="Clear chat">🗑</button>
        <button class="icon-btn" onclick="togglePanel()" title="Close">✕</button>
      </div>
    </div>

    <!-- ── Login view ── -->
    <div id="panel-login">
      <div class="login-icon">🔐</div>
      <h3>Sign in to chat</h3>
      <p>Use your Task Manager account credentials</p>

      <div class="login-err" id="login-err"></div>

      <div class="field">
        <label for="p-email">Email</label>
        <input id="p-email" type="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="p-pass">Password</label>
        <input id="p-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-sign-in" id="sign-in-btn" onclick="handleLogin()">Sign In</button>
    </div>

    <!-- ── Chat view (hidden until logged in) ── -->
    <div id="panel-messages" class="hidden"></div>
    <div id="panel-input-area" class="hidden">
      <div class="input-row">
        <textarea
          id="panel-input"
          rows="1"
          placeholder="Ask anything… (Enter to send)"
        ></textarea>
        <button id="panel-send" onclick="sendMessage()">➤</button>
      </div>
      <div class="bottom-row">
        <span>Shift+Enter for new line</span>
        <button class="clear-link" onclick="clearChat()">Clear conversation</button>
      </div>
    </div>

  </div><!-- /chat-panel -->

  <script>
    // ── State ──────────────────────────────────────────────────────────
    let token     = localStorage.getItem('aichat_token') || null;
    let history   = [];   // { role, content }[]
    let streaming = false;
    let panelOpen = false;

    // ── Boot ───────────────────────────────────────────────────────────
    (function init() {
      if (token) switchToChat();
    })();

    // ── Toggle panel open / closed ─────────────────────────────────────
    function togglePanel() {
      panelOpen = !panelOpen;
      document.getElementById('chat-panel').classList.toggle('open', panelOpen);
      document.getElementById('chat-bubble').classList.toggle('open', panelOpen);
      document.getElementById('bubble-icon').textContent = panelOpen ? '✕' : '🤖';

      if (panelOpen) {
        // Clear unread badge
        document.getElementById('unread-badge').classList.remove('show');
        // Focus appropriate input
        setTimeout(() => {
          const el = token
            ? document.getElementById('panel-input')
            : document.getElementById('p-email');
          el?.focus();
        }, 260);
      } else {
        document.getElementById('bubble-icon').textContent = '🤖';
      }
    }

    // Show badge when panel is closed
    function nudgeBadge() {
      if (!panelOpen) {
        document.getElementById('unread-badge').classList.add('show');
      }
    }

    // ── Auth ───────────────────────────────────────────────────────────
    async function handleLogin() {
      const email = document.getElementById('p-email').value.trim();
      const pass  = document.getElementById('p-pass').value;
      const errEl = document.getElementById('login-err');
      const btn   = document.getElementById('sign-in-btn');

      errEl.classList.remove('show');
      if (!email || !pass) { showLoginErr('Enter your email and password.'); return; }

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res  = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass }),
        });
        const data = await res.json();
        if (!res.ok) { showLoginErr(data.message || 'Login failed.'); return; }

        token = data.token;
        localStorage.setItem('aichat_token', token);
        switchToChat();
      } catch {
        showLoginErr('Cannot reach server. Is the backend running?');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    function showLoginErr(msg) {
      const el = document.getElementById('login-err');
      el.textContent = msg;
      el.classList.add('show');
    }

    function logout() {
      token = null;
      history = [];
      localStorage.removeItem('aichat_token');
      document.getElementById('panel-login').classList.remove('hidden');
      document.getElementById('panel-messages').classList.add('hidden');
      document.getElementById('panel-input-area').classList.add('hidden');
    }

    function switchToChat() {
      document.getElementById('panel-login').classList.add('hidden');
      document.getElementById('panel-messages').classList.remove('hidden');
      document.getElementById('panel-input-area').classList.remove('hidden');
      if (!document.getElementById('welcome-inner')) renderWelcome();
    }

    function renderWelcome() {
      const el = document.getElementById('panel-messages');
      el.innerHTML = `
        <div class="panel-welcome" id="welcome-inner">
          <div style="font-size:1.8rem;margin-bottom:.4rem">✨</div>
          <h4>Hi! I'm your AI assistant</h4>
          <p>Ask me about tasks, planning, priorities, or anything else.</p>
          <div class="suggestions">
            <button class="chip" onclick="useSuggestion(this)">📋 Break down a big task</button>
            <button class="chip" onclick="useSuggestion(this)">⚡ How to prioritise work</button>
            <button class="chip" onclick="useSuggestion(this)">📅 Tips for deadlines</button>
            <button class="chip" onclick="useSuggestion(this)">🎯 Eisenhower Matrix</button>
          </div>
        </div>`;
    }

    // ── Textarea auto-resize + keyboard shortcut ───────────────────────
    document.getElementById('panel-input').addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });
    document.getElementById('panel-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    document.getElementById('p-email').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('p-pass').focus();
    });
    document.getElementById('p-pass').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });

    // ── Send ───────────────────────────────────────────────────────────
    function useSuggestion(chip) {
      const text = chip.textContent.replace(/^[^\w]+/u, '').trim();
      document.getElementById('panel-input').value = text;
      sendMessage();
    }

    async function sendMessage() {
      if (streaming) return;
      const input = document.getElementById('panel-input');
      const text  = input.value.trim();
      if (!text) return;

      // Remove welcome banner on first real message
      document.getElementById('welcome-inner')?.remove();

      appendMsg('user', text);
      history.push({ role: 'user', content: text });

      input.value = '';
      input.style.height = 'auto';
      document.getElementById('panel-send').disabled = true;
      streaming = true;

      const typingId = addTyping();

      try {
        const res = await fetch('/api/ai/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ messages: history }),
        });

        if (res.status === 401) { removeTyping(typingId); logout(); return; }

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          removeTyping(typingId);
          appendMsg('ai', `⚠️ ${err.message || 'Something went wrong.'}`);
          return;
        }

        // Read SSE stream
        const reader  = res.body.getReader();
        const decoder = new TextDecoder();
        let aiText = '';
        let bubble = null;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const raw = decoder.decode(value, { stream: true });
          for (const line of raw.split('\n')) {
            if (!line.startsWith('data: ')) continue;
            try {
              const payload = JSON.parse(line.slice(6));
              if (payload.done) break;
              if (payload.error) {
                if (!bubble) { removeTyping(typingId); bubble = appendMsg('ai', ''); }
                bubble.textContent += '\n⚠️ ' + payload.error;
                break;
              }
              if (payload.token) {
                if (!bubble) { removeTyping(typingId); bubble = appendMsg('ai', ''); }
                aiText += payload.token;
                bubble.textContent = aiText;
                scrollBottom();
              }
            } catch { /* ignore malformed SSE */ }
          }
        }

        if (!bubble) removeTyping(typingId);
        if (aiText) {
          history.push({ role: 'assistant', content: aiText });
          nudgeBadge(); // ping bubble if panel was closed
        }

      } catch (err) {
        removeTyping(typingId);
        appendMsg('ai', '⚠️ Network error. Check your connection.');
        console.error('[Chat]', err);
      } finally {
        streaming = false;
        document.getElementById('panel-send').disabled = false;
        input.focus();
      }
    }

    // ── DOM helpers ────────────────────────────────────────────────────
    function appendMsg(role, text) {
      const container = document.getElementById('panel-messages');
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;

      const av = document.createElement('div');
      av.className = 'msg-av';
      av.textContent = role === 'user' ? '👤' : '🤖';

      const bbl = document.createElement('div');
      bbl.className = 'bbl';
      bbl.textContent = text;

      wrap.appendChild(av);
      wrap.appendChild(bbl);
      container.appendChild(wrap);
      scrollBottom();
      return bbl;
    }

    function addTyping() {
      const id   = 'typing-' + Date.now();
      const container = document.getElementById('panel-messages');
      const wrap = document.createElement('div');
      wrap.className = 'msg ai';
      wrap.id = id;

      const av = document.createElement('div');
      av.className = 'msg-av';
      av.textContent = '🤖';

      const bbl = document.createElement('div');
      bbl.className = 'bbl typing-dots';
      bbl.innerHTML = '<span></span><span></span><span></span>';

      wrap.appendChild(av);
      wrap.appendChild(bbl);
      container.appendChild(wrap);
      scrollBottom();
      return id;
    }

    function removeTyping(id) { document.getElementById(id)?.remove(); }

    function scrollBottom() {
      const el = document.getElementById('panel-messages');
      el.scrollTop = el.scrollHeight;
    }

    function clearChat() {
      history = [];
      renderWelcome();
    }
  </script>
</body>
</html>
