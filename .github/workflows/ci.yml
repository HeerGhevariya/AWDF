name: CI — Task Management API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    # Set the working directory for ALL run steps
    defaults:
      run:
        working-directory: task_management_system

    steps:
      # ── 1. Check out the repository ────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Node.js — point cache to the subfolder's lock file ───────
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: task_management_system/package-lock.json

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies (npm install)
        run: npm install

      # ── 4. Run the automated test suite ───────────────────────────────────
      - name: Run tests (npm test)
        run: npm test
